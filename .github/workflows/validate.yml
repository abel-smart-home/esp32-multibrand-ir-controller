name: Verificar firmware y repositorio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v5
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'PyYAML>=6,<7' 'esphome==2026.10.1'
      - name: Pruebas de estructura
        run: python -m unittest discover -s tests -v
      - name: Crear secretos ficticios para CI
        run: cp firmware/secrets.ci.yaml firmware/secrets.yaml
      - name: Validar V0.1
        run: esphome config firmware/ir_multimarca_lab.yaml
      - name: Compilar V0.1
        run: esphome compile firmware/ir_multimarca_lab.yaml
      - name: Validar V0.2 Mirage
        run: esphome config firmware/ir_mirage_magnum22_v02.yaml
      - name: Compilar V0.2 Mirage
        run: esphome compile firmware/ir_mirage_magnum22_v02.yaml
      - name: Validar V0.3 multimarca
        run: esphome config firmware/ir_multimarca_v03.yaml
      - name: Compilar V0.3 multimarca
        run: esphome compile firmware/ir_multimarca_v03.yaml

# Binarios solo para CI, credenciales ficticias; no subir .bin a Releases.
